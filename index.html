<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estadísticas de Baloncesto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: marcador fijo arriba, una columna de tarjetas (dos en pantallas anchas), barra de pestañas abajo como en una app móvil */
  --bg:#F2F0EB; --surface:#FFFFFF; --ink:#1A1C21; --muted:#686B73; --line:#DDD9D0;
  --accent:#D4531F; --accent-soft:#FBE9DF;
  --good:#1D7F53; --good-bg:#E1F2E8; --bad:#BE352D; --bad-bg:#FAE4E1; --warn:#9A6514; --warn-bg:#FCF0D9;
  --board:#17191E; --board-ink:#F4F2ED; --board-muted:#9095A0; --board-btn:#2A2D35;
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111216; --surface:#1B1D23; --ink:#ECEAE4; --muted:#9A9DA6; --line:#2D3038;
    --accent:#F07038; --accent-soft:#3A2218;
    --good:#46BE85; --good-bg:#14301F; --bad:#F06B61; --bad-bg:#3B1B19; --warn:#E3A84A; --warn-bg:#3A2C14;
    --board:#08090C; --board-ink:#F4F2ED; --board-muted:#8A8F99; --board-btn:#22252C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111216; --surface:#1B1D23; --ink:#ECEAE4; --muted:#9A9DA6; --line:#2D3038;
  --accent:#F07038; --accent-soft:#3A2218;
  --good:#46BE85; --good-bg:#14301F; --bad:#F06B61; --bad-bg:#3B1B19; --warn:#E3A84A; --warn-bg:#3A2C14;
  --board:#08090C; --board-ink:#F4F2ED; --board-muted:#8A8F99; --board-btn:#22252C;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{min-height:100%;display:flex;flex-direction:column}

/* Marcador */
.top{position:sticky;top:0;z-index:5;background:var(--board);color:var(--board-ink);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.sb{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:12px}
.sb.plain{display:flex;align-items:center;min-height:36px}
.brand{font-family:var(--font-display);font-size:24px;font-weight:700;letter-spacing:.02em}
.brand b{color:var(--board-muted);font-weight:600}
.team{display:flex;flex-direction:column;min-width:0}
.team.r{align-items:flex-end;text-align:right}
.tname{font-size:12px;color:var(--board-muted);text-transform:uppercase;letter-spacing:.07em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pts{font-family:var(--font-display);font-size:48px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.team:first-child .pts{color:var(--accent)}
.vs{font-family:var(--font-display);color:var(--board-muted);font-size:20px;padding-bottom:8px}
.opp{display:flex;gap:4px;margin-top:6px}
.opp button,.qs button{background:var(--board-btn);border:0;border-radius:6px;padding:6px 9px;font-weight:600;font-size:13px;color:var(--board-ink);font-variant-numeric:tabular-nums}
.qrow{max-width:1400px;margin:10px auto 0;display:flex;align-items:center;gap:8px}
.qrow .lbl{font-size:12px;color:var(--board-muted);text-transform:uppercase;letter-spacing:.07em}
.qs{display:flex;gap:4px}
@media (max-width:420px){.qrow .lbl{display:none}.qrow{gap:6px}.opp{gap:3px}}
.qs button[aria-pressed="true"]{background:var(--accent);color:#fff}
.tcol{display:flex;flex-direction:column;min-width:0;align-items:flex-end}
.team.r{flex-direction:row;justify-content:flex-end;align-items:flex-end;gap:14px}
.mid,.opp-wide{display:none}
@media (min-width:700px){
  .vs,.qrow{display:none}
  .mid{display:flex;align-self:center}
  .opp-wide{display:flex;margin:0 0 2px;gap:8px}
  .qs button{padding:8px 13px;font-size:15px}
  .opp-wide button{font-family:var(--font-display);font-size:26px;font-weight:700;min-width:64px;min-height:52px;padding:6px 14px;border-radius:10px;background:#3A3E48}
  .opp-wide button:active{background:var(--accent)}
}

main{flex:1;width:100%;max-width:1400px;margin:0 auto;padding:16px 16px calc(92px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
h2{font-family:var(--font-display);font-size:22px;font-weight:700;margin:0 0 10px;letter-spacing:.01em;text-wrap:balance;line-height:1.1}
h2 .count{color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:13px}
p{margin:0 0 10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink);font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:0;text-decoration:underline}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.subbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{padding:8px 14px;border:0;background:transparent;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.banner{background:var(--warn-bg);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}

/* Partido en directo */
.live{display:flex;flex-direction:column;gap:14px}
.right{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:900px){
  .live{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}
  .abtn{min-height:72px}.abtn .big{font-size:28px}.abtn .o{font-size:21px}
  .logcard .log{max-height:240px;overflow-y:auto}
}
/* Cancha */
.cc{display:flex;flex-direction:column;gap:12px}
.court{position:relative;width:100%;max-width:max(300px,calc((100vh - 400px) * 1.07));margin:0 auto;aspect-ratio:500/467}
@supports (height:100dvh){.court{max-width:max(300px,calc((100dvh - 400px) * 1.07))}}
.court svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.tok{position:absolute;transform:translate(-50%,-50%);width:21%;min-width:64px;aspect-ratio:1;border-radius:50%;background:var(--board);color:#F4F2ED;border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;gap:0;transition:transform .08s}
.tok:active{transform:translate(-50%,-50%) scale(.95)}
.tok .num{font-family:var(--font-display);font-size:clamp(22px,2.6vw,34px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tok .nm{font-size:11px;font-weight:500;max-width:84%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tok .mini{font-size:10px;opacity:.75;font-variant-numeric:tabular-nums}
.tok[aria-pressed="true"]{background:var(--accent)}
.tok.f4 .fl{color:#F5C46A;opacity:1;font-weight:700}
.tok.f5{background:#6B6E76}
.tok.empty{background:rgba(255,255,255,.75);border:2px dashed #8A8F99;color:#5A5E66;box-shadow:none;font-size:12px;font-weight:600}
.court.subbing .tok:not(.empty){outline:3px dashed var(--accent);outline-offset:3px}
.bench{display:flex;flex-wrap:wrap;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.benchh{flex-basis:100%;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.bbtn{min-height:56px;width:84px;flex:0 0 auto}
.bbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.dot.sub{background:var(--accent)}
/* Estadísticas */
.grid2{display:flex;flex-direction:column;gap:14px}
@media (min-width:900px){.grid2{display:grid;grid-template-columns:1fr 1fr;align-items:start}}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span{display:flex;flex-direction:column;font-size:14px}
.kv small{color:var(--muted);font-size:12px}
.kv b{font-family:var(--font-display);font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.trend{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-zero{stroke:var(--muted)}
.ch-lab{fill:var(--muted);font-size:11px;font-family:var(--font-body);font-variant-numeric:tabular-nums}
.ch-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ch-dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.ch-trend{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:6 5;opacity:.6}
.ch-hit{fill:transparent;cursor:pointer}
.ch-tip{position:absolute;transform:translate(-50%,calc(-100% - 12px));background:var(--board);color:var(--board-ink);font-size:12px;padding:5px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;z-index:2}
.link.plain{text-decoration:none;color:var(--ink);font-weight:500;text-align:left}
td.pos{color:var(--good);font-weight:600} td.neg{color:var(--bad);font-weight:600}
.lu{display:inline-block;min-width:26px;text-align:center;background:var(--bg);border-radius:4px;padding:1px 4px;margin-right:4px;font-weight:600}
.gl{margin-top:8px;font-size:13px}
.gl summary{cursor:pointer;color:var(--accent);font-weight:600}
.gl dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0 0}
.gl dt{font-weight:600} .gl dd{margin:0;color:var(--muted)}
.ink{color:var(--ink)}
.qrow .opp button{font-family:var(--font-display);font-size:20px;font-weight:700;min-width:48px;min-height:40px;padding:4px 10px;background:#3A3E48}
.banner.ok{background:var(--good-bg)}
.edscore{margin:12px 0 0;font-size:15px}
.edscore b{font-family:var(--font-display);font-size:24px}
.qedit{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.qedit label{width:72px}
.edt td{padding:4px 3px}
.edt th{white-space:nowrap}
.edt input{width:54px;padding:8px 4px;text-align:center;font-size:15px;font-variant-numeric:tabular-nums}
.edt td.minc input{width:60px;border-color:var(--accent)}
.edt thead th.minc{color:var(--accent)}
.addp{margin-top:12px;align-items:flex-end}
.addp label{flex:0 1 320px}

.rotate{display:none}
@media (orientation:portrait) and (min-width:600px){.rotate{display:flex}}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.pbtn{background:var(--bg);border:2px solid transparent;border-radius:var(--r);padding:7px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:68px;min-width:0}
.pbtn .num{font-family:var(--font-display);font-size:28px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.pbtn .nm{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pbtn .mini{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.pbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pbtn.f4 .fl{color:var(--warn);font-weight:600}
.pbtn.f5 .fl{color:var(--bad);font-weight:600}
.pbtn.f5 .num{color:var(--muted)}
.pad{display:flex;flex-direction:column;gap:8px}
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.others{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.abtn{min-height:58px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;font-weight:600;font-size:12px;transition:transform .08s}
.abtn:active{transform:scale(.96)}
.abtn .big{font-family:var(--font-display);font-size:24px;line-height:1;font-weight:700}
.abtn .o{font-family:var(--font-display);font-size:19px;font-weight:600;line-height:1.05;text-align:center}
.abtn.ok{background:var(--good-bg);border-color:transparent;color:var(--good)}
.abtn.miss{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.abtn.neg .o{color:var(--warn)}
.pad.off .abtn{opacity:.38;pointer-events:none}
.hint{font-size:13px;color:var(--muted);margin:-4px 0 10px}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.log li:last-child{border-bottom:0}
.log .q{font-size:11px;font-weight:600;color:var(--muted);background:var(--bg);border-radius:4px;padding:1px 5px;font-variant-numeric:tabular-nums}
.log .tx{flex:1;min-width:0}
.log .x{background:none;border:0;color:var(--muted);font-size:18px;line-height:1;padding:4px 8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;background:var(--muted)}
.dot.ok{background:var(--good)} .dot.miss{background:var(--bad)} .dot.opp{background:var(--board-muted)}
.cardhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}

/* Formularios */
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > label{flex:1 1 140px}
.row > label.narrow{flex:0 1 90px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
input,select,textarea{font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:12px}
fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0}
legend{font-size:13px;color:var(--muted);font-weight:600;padding:0 4px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px;padding:4px 0}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.err{color:var(--bad);font-size:13px;margin:0;min-height:0}
.err:empty{display:none}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.plist li:last-child{border-bottom:0}
.pnum{font-family:var(--font-display);font-size:26px;font-weight:700;width:40px;text-align:center;font-variant-numeric:tabular-nums}
.pinfo{flex:1;display:flex;flex-direction:column;min-width:0}
.pinfo small{color:var(--muted)}
.pact{display:flex;gap:6px}

/* Historial */
.glist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.grow{width:100%;display:grid;grid-template-columns:1fr auto;grid-template-areas:"d s" "v p";gap:2px 10px;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.gdate{grid-area:d;font-size:12px;color:var(--muted)}
.gvs{grid-area:v;font-weight:600}
.gsc{grid-area:s;font-family:var(--font-display);font-size:22px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;line-height:1}
.grow .pill{grid-area:p;justify-self:end}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--muted);white-space:nowrap}
.pill.w{background:var(--good-bg);color:var(--good)}
.pill.l{background:var(--bad-bg);color:var(--bad)}
.pill.live{background:var(--accent);color:#fff}

/* Tablas */
.tbl-wrap{overflow-x:auto;margin:0 -14px 10px;padding:0 14px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
tbody th,tfoot th{text-align:left;font-weight:500;position:sticky;left:0;background:var(--surface)}
thead th:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
tfoot td,tfoot th{font-weight:600;border-bottom:0}
tfoot tr:first-child td,tfoot tr:first-child th{border-top:2px solid var(--ink)}
tr.pct td,tr.pct th{color:var(--muted);font-weight:500}
.dn{display:inline-block;min-width:22px;color:var(--muted);font-weight:600}
td.hi{color:var(--accent);font-weight:600}
.qt{max-width:480px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.tile{background:var(--bg);border-radius:10px;padding:10px 12px}
.tile b{display:block;font-family:var(--font-display);font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}

/* Barra de pestañas */
.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
.tabbar nav{max-width:960px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{background:none;border:0;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar svg{width:22px;height:22px}

/* Aviso y diálogo */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));z-index:8;width:min(440px,calc(100% - 32px))}
.toast{background:var(--board);color:var(--board-ink);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:12px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast span{flex:1;min-width:0}
.toast button{background:none;border:0;color:var(--accent);font-weight:700;padding:4px}
.modal-bg{position:fixed;inset:0;background:rgba(10,11,14,.5);z-index:10;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;padding:18px;width:min(420px,100%);display:flex;flex-direction:column;gap:12px;max-height:90%;overflow:auto}
.modal h3{margin:0;font-family:var(--font-display);font-size:22px}
.modal p{margin:0}
.modal .btns{justify-content:flex-end}
.btn.dangerfill{background:var(--bad);border-color:var(--bad);color:#fff}
/* Tablet en horizontal: pestañas en un lateral para ganar altura */
@media (min-width:900px) and (orientation:landscape){
  #app{padding-left:88px}
  .tabbar{top:0;bottom:0;right:auto;width:88px;border-top:0;border-right:1px solid var(--line);padding:env(safe-area-inset-top) 0 0 env(safe-area-inset-left)}
  .tabbar nav{grid-template-columns:1fr;grid-auto-rows:min-content;gap:4px;padding-top:14px}
  .tabbar button{padding:12px 4px}
  .tabbar svg{width:26px;height:26px}
  main{padding-bottom:24px}
  #toast{bottom:20px;left:calc(50% + 44px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" aria-live="polite"></div>
<script>
(function(){
"use strict";

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-3); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

}

/* Datos de ejemplo */
function rng(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function genGame(players, sd, rival, date, place, qs, perQ, done, form){
  var r = rng(sd), k = 1+(form||0);
  var W = [["2A",13*k],["2F",11/k],["3A",5*k],["3F",8/k],["1A",6],["1F",2],["RO",4],["RD",9],["AS",6*k],["RB",3],["TP",1],["PE",5/k],["FC",5]];
  var pw = {}; players.forEach(function(p,i){ pw[p.id] = [5,5,4,4,4,3,3,2,2,2][i]||2; });
  function pick(n, wf){ var tot=0,i; for(i=0;i<n;i++) tot+=wf(i); var x=r()*tot; for(i=0;i<n;i++){ x-=wf(i); if(x<=0) return i; } return n-1; }
  var ev=[], t=Date.parse(date+"T18:00:00");
  var oc = players.slice(0,5).map(function(p){ return p.id; });
  oc.forEach(function(id){ ev.push({id:uid(),p:null,a:"SUB","in":id,out:null,q:1,t:(t+=1000)}); });
  for(var q=1;q<=qs;q++){
    var n = (q===qs && !done) ? Math.round(perQ*0.4) : perQ;
    for(var i=0;i<n;i++){
      if(r()<0.08){
        var bench = players.filter(function(p){ return oc.indexOf(p.id)<0; });
        var oi = Math.floor(r()*5), ip = bench[Math.floor(r()*bench.length)];
        ev.push({id:uid(),p:null,a:"SUB","in":ip.id,out:oc[oi],q:q,t:(t+=5000)}); oc[oi]=ip.id;
      }
      var a = W[pick(W.length,function(j){return W[j][1];})][0];
      var pid = oc[pick(5,function(j){ return pw[oc[j]]; })];
      ev.push({id:uid(),p:pid,a:a,q:q,t:(t+=20000)});
      if(r()<0.3){ var o = r()<0.2 ? 3 : (r()<0.15 ? 1 : 2); ev.push({id:uid(),p:null,a:"OPP",pts:o,q:q,t:(t+=15000)}); }
    }
  }
  return {id:uid(),rival:rival,date:date,place:place,roster:players.map(function(p){return p.id;}),events:ev,q:qs,done:done,sample:true,onCourt:oc.slice()};
}
function seed(){
  var list = [[4,"Álex Martín","Base"],[7,"Hugo Pérez","Escolta"],[10,"Dani Ruiz","Alero"],[12,"Marcos Gil","Alero"],[15,"Iván López","Ala-pívot"],[21,"Pablo Sanz","Pívot"],[8,"Leo Torres","Base"],[5,"Raúl Moreno","Escolta"],[23,"Nico Castro","Ala-pívot"],[33,"Sergio Vidal","Pívot"]];
  var players = list.map(function(x){ return {id:uid(),num:x[0],name:x[1],pos:x[2],active:true,sample:true}; });
  var cal = [["2026-10-04","CB Riberas","Local"],["2026-10-11","Basket Sur","Visitante"],["2026-10-18","CD Alameda","Local"],["2026-10-25","UD Este","Visitante"],["2026-11-01","CB Los Pinos","Local"],["2026-11-08","Ciudad Vieja Basket","Visitante"]];
  var games = cal.map(function(c,i){ return genGame(players, 11+i*7, c[1], c[0], c[2], 4, 26, true, -0.15+i*0.07); });
  var live = genGame(players, 97, "Club Atlético Norte", today(), "Visitante", 3, 24, false, 0.1);
  games.push(live);
  return {v:2,team:"Mi equipo",players:players,games:games,liveId:live.id,sample:true};
}

var SPOTS = [[50,77],[17,52],[83,52],[27,23],[73,23]];
function ensureCourt(g){
  if(!Array.isArray(g.onCourt)) g.onCourt = [];
  while(g.onCourt.length<5) g.onCourt.push(null);
  for(var i=0;i<5;i++){ var id=g.onCourt[i]; if(id && (!player(id) || g.roster.indexOf(id)<0)) g.onCourt[i]=null; }
  return g.onCourt;
}
function tag(id){ var p=player(id); return p ? "#"+p.num+" "+short(p.name) : "Jugador"; }
function addSub(g, inId, outId){
  var ev = {id:uid(), p:null, a:"SUB", "in":inId||null, out:outId||null, q:g.q, t:Date.now()};
  g.events.push(ev); return ev;
}
function revertSub(g, e){
  var oc = ensureCourt(g), k;
  if(e["in"]){
    k = oc.indexOf(e["in"]);
    if(k>=0) oc[k] = (e.out && oc.indexOf(e.out)<0) ? e.out : null;
  } else if(e.out && oc.indexOf(e.out)<0){
    k = oc.indexOf(null); if(k>=0) oc[k] = e.out;
  }
}
function removeEv(g, id){
  for(var i=g.events.length-1;i>=0;i--){
    if(g.events[i].id===id){ var e=g.events.splice(i,1)[0]; if(e.a==="SUB") revertSub(g,e); return; }
  }
}

function calc(events, pid){
  var s={pts:0,t2m:0,t2a:0,t3m:0,t3a:0,tlm:0,tla:0,ro:0,rd:0,as:0,rb:0,tp:0,pe:0,fc:0};
  for(var i=0;i<events.length;i++){
    var e=events[i];
    if(e.p==null) continue;
    if(pid!==undefined && e.p!==pid) continue;
    if(e.a==="ADJ"){ for(var k in e.d){ if(s.hasOwnProperty(k)) s[k]+=e.d[k]; } s.pts += 2*(e.d.t2m||0)+3*(e.d.t3m||0)+(e.d.tlm||0); continue; }
    switch(e.a){
      case "2A": s.t2m++; s.t2a++; s.pts+=2; break;
      case "2F": s.t2a++; break;
      case "3A": s.t3m++; s.t3a++; s.pts+=3; break;
      case "3F": s.t3a++; break;
      case "1A": s.tlm++; s.tla++; s.pts+=1; break;
      case "1F": s.tla++; break;
      case "RO": s.ro++; break; case "RD": s.rd++; break;
      case "AS": s.as++; break; case "RB": s.rb++; break;
      case "TP": s.tp++; break; case "PE": s.pe++; break; case "FC": s.fc++; break;
    }
  }
  s.reb = s.ro+s.rd; s.fgm = s.t2m+s.t3m; s.fga = s.t2a+s.t3a;
  s.val = s.pts+s.reb+s.as+s.rb+s.tp-(s.fga-s.fgm)-(s.tla-s.tlm)-s.pe-s.fc;
  return s;
}
function score(g, q){
  var us=0, op=0;
  for(var i=0;i<g.events.length;i++){
    var e=g.events[i];
    if(q && e.q!==q) continue;
    if(e.a==="OPP" || e.a==="OPPADJ") op+=e.pts;
    else if(e.a==="ADJ") us += 2*(e.d.t2m||0)+3*(e.d.t3m||0)+(e.d.tlm||0);
    else if(ACT[e.a] && ACT[e.a].pts) us+=ACT[e.a].pts;
  }
  return {us:us,op:op};
}

  return '<button class="abtn '+(a.cls||"")+'" data-do="act:'+c+'" aria-label="'+a.t+'">'+inner+'</button>';

function logCard(g){
  var ev = g.events.filter(function(e){ return e.a!=="ADJ" && e.a!=="OPPADJ"; }).slice(-10).reverse();
  return '<section class="card logcard"><div class="cardhead"><h2>Últimas acciones</h2>'+
    (ev.length ? '<button class="btn sm" data-do="undo">Deshacer última</button>' : '')+'</div>'+
    (ev.length ? '<ul class="log">'+ev.map(function(e){
      var txt, cls;
      if(e.a==="OPP"){ txt = esc(g.rival)+' · +'+e.pts; cls="opp"; }
      else if(e.a==="SUB"){ cls="sub"; txt = e["in"]&&e.out ? 'Cambio · entra '+esc(tag(e["in"]))+', sale '+esc(tag(e.out)) : e["in"] ? 'Entra a pista '+esc(tag(e["in"])) : 'Al banquillo '+esc(tag(e.out)); }
      else { var p = player(e.p); txt = (p ? '#'+p.num+' '+esc(short(p.name)) : 'Jugador')+' · '+ACT[e.a].t; cls = ACT[e.a].cls==="ok"?"ok":ACT[e.a].cls==="miss"?"miss":""; }
      return '<li><span class="q">'+QL[e.q-1]+'</span><span class="tx"><span class="dot '+cls+'"></span>'+txt+'</span><button class="x" data-do="delev:'+e.id+'" aria-label="Borrar esta acción">×</button></li>';
    }).join("")+'</ul>' : '<p class="muted small">Aún no hay acciones en este partido.</p>')+'</section>';
}

        '<span class="pact"><button class="btn sm" data-do="edit:'+p.id+'">Editar</button><button class="btn sm danger" data-do="delp:'+p.id+'">Quitar</button></span></li>';
    }).join("")+'</ul>' : '<p class="muted">Aún no hay jugadores. Añade el primero con el formulario de arriba.</p>')+
    (bajas.length ? '<p class="muted small" style="margin-top:10px">De baja (sus estadísticas se conservan): '+bajas.map(function(p){ return '#'+p.num+' '+esc(p.name)+' <button class="link" data-do="restore:'+p.id+'">Recuperar</button>'; }).join(" · ")+'</p>' : '')+
    '</section>'+
    '<section class="card"><h2>Equipo</h2><form id="f-team" class="row" novalidate><label for="t-name">Nombre de tu equipo<input id="t-name" maxlength="40" value="'+esc(S.team)+'"></label>'+
    '<button class="btn" type="submit" style="align-self:flex-end">Guardar</button></form></section>'+
    '<section class="card"><h2>Copia de seguridad</h2><p class="muted small">Los datos se guardan solo en este dispositivo. Exporta una copia de vez en cuando para no perderlos o para pasarlos a otro móvil.</p>'+
    '<div class="btns"><button class="btn" data-do="export">Exportar copia</button><button class="btn" data-do="import">Importar copia</button><input type="file" id="imp" accept=".json,application/json" hidden></div></section>';
}

function boxScore(g){
  var ps = g.roster.map(player).filter(Boolean).sort(byNum);
  var head = ["MIN","PTS","T2","T3","TL","RO","RD","REB","AS","RB","TP","PE","FC","+/-","VAL"];
  var tk = track(g), mins = g.min||{}, msum = 0, mhas = false;
  Object.keys(mins).forEach(function(k){ msum += mins[k]; mhas = true; });
  function row(s, id){ return [id===undefined ? (mhas?msum:"–") : (mins[id]!=null?mins[id]:"–"), s.pts, s.t2m+"/"+s.t2a, s.t3m+"/"+s.t3a, s.tlm+"/"+s.tla, s.ro, s.rd, s.reb, s.as, s.rb, s.tp, s.pe, s.fc, id===undefined ? "" : (tk.tracked ? fsign(tk.pm[id]||0) : "–"), s.val]; }
  var all = ps.map(function(p){ return {p:p, s:calc(g.events,p.id)}; });
  var best = Math.max.apply(null, all.map(function(x){return x.s.pts;}).concat([0]));
  var tot = calc(g.events);
  return '<div class="tbl-wrap"><table><thead><tr><th scope="col">Jugador</th>'+head.map(function(x){ return '<th scope="col" title="'+(TITLES[x]||(x==="MIN"?"Minutos":"Más/menos"))+'">'+x+'</th>'; }).join("")+'</tr></thead><tbody>'+
    all.map(function(x){ return '<tr><th scope="row"><span class="dn">'+x.p.num+'</span>'+esc(short(x.p.name))+'</th>'+row(x.s,x.p.id).map(function(v,i){ return '<td'+(i===1&&best>0&&x.s.pts===best?' class="hi"':'')+'>'+v+'</td>'; }).join("")+'</tr>'; }).join("")+
    '</tbody><tfoot><tr><th scope="row">Equipo</th>'+row(tot).map(function(v){ return '<td>'+v+'</td>'; }).join("")+'</tr>'+
    '<tr class="pct"><th scope="row">Porcentaje</th><td></td><td></td><td>'+pct(tot.t2m,tot.t2a)+'</td><td>'+pct(tot.t3m,tot.t3a)+'</td><td>'+pct(tot.tlm,tot.tla)+'</td><td colspan="10"></td></tr></tfoot></table></div>'+
    '<p class="muted small">+/- = diferencia de puntos con el jugador en pista. VAL = puntos + rebotes + asistencias + robos + tapones − tiros fallados − pérdidas − faltas.</p>';
}

function quarterTable(g){
  var maxq = maxQ(g);
  var qs=[]; for(var i=1;i<=maxq;i++) qs.push(i);
  var t = score(g), sq = 0; qs.forEach(function(q){ sq += score(g,q).us; });
  var adj = t.us - sq;
  return '<div class="tbl-wrap"><table class="qt"><thead><tr><th scope="col">Parcial</th>'+qs.map(function(q){ return '<th scope="col">'+QL[q-1]+'</th>'; }).join("")+(adj?'<th scope="col" title="Puntos añadidos o quitados al corregir el acta">Correcc.</th>':'')+'<th scope="col">Total</th></tr></thead><tbody>'+
    '<tr><th scope="row">'+esc(S.team)+'</th>'+qs.map(function(q){ return '<td>'+score(g,q).us+'</td>'; }).join("")+(adj?'<td>'+fsign(adj)+'</td>':'')+'<td><b>'+t.us+'</b></td></tr>'+
    '<tr><th scope="row">'+esc(g.rival)+'</th>'+qs.map(function(q){ return '<td>'+score(g,q).op+'</td>'; }).join("")+(adj?'<td></td>':'')+'<td><b>'+t.op+'</b></td></tr></tbody></table></div>';
}

function resultPill(g){
  if(g.id===S.liveId) return '<span class="pill live">En juego</span>';
  var s = score(g);
  return s.us>s.op ? '<span class="pill w">Victoria</span>' : s.us<s.op ? '<span class="pill l">Derrota</span>' : '<span class="pill">Empate</span>';
}

/* ---------- Métricas ---------- */
function f1(x){ return (Math.round(x*10)/10).toFixed(1).replace(".",","); }
function fsign(x, dec){ if(x==null || isNaN(x)) return "–"; var v = dec ? f1(Math.abs(x)) : String(Math.abs(Math.round(x))); return (x>0?"+":x<0?"−":"")+v; }
function fpc(x){ return x==null || isNaN(x) ? "–" : Math.round(x)+"%"; }
function efg(s){ return s.fga ? 100*(s.fgm+0.5*s.t3m)/s.fga : null; }
function tsp(s){ var d = 2*(s.fga+0.44*s.tla); return d ? 100*s.pts/d : null; }
function possOf(s){ return s.fga + 0.44*s.tla - s.ro + s.pe; }
function astTo(s){ return s.pe ? s.as/s.pe : null; }
function doneGames(){ return S.games.filter(function(g){ return g.done; }).sort(function(a,b){ return a.date.localeCompare(b.date); }); }
function allEvents(gs){ var e=[]; gs.forEach(function(g){ e = e.concat(g.events); }); return e; }

/* Más/menos y quintetos: se reconstruye quién estaba en pista con los cambios registrados */
function track(g){
  var on=[], pm={}, lu={}, tracked=false;
  g.events.forEach(function(e){
    if(e.a==="SUB"){
      tracked = true;
      if(e.out){ var i=on.indexOf(e.out); if(i>=0) on.splice(i,1); }
      if(e["in"] && on.indexOf(e["in"])<0) on.push(e["in"]);
      return;
    }
    var pts=0, ours=false;
    if(e.a==="OPP") pts=e.pts; else if(ACT[e.a] && ACT[e.a].pts){ pts=ACT[e.a].pts; ours=true; }
    if(!pts) return;
    on.forEach(function(id){ pm[id] = (pm[id]||0) + (ours?pts:-pts); });
    if(on.length===5){
      var k = on.slice().sort().join(",");
      var L = lu[k] || (lu[k] = {ids:on.slice(), pf:0, pa:0});
      if(ours) L.pf+=pts; else L.pa+=pts;
    }
  });
  return {pm:pm, lu:lu, tracked:tracked};
}

var TEAM_M = {
  pf:{l:"Puntos a favor", u:"puntos", hb:1, get:function(g){ return score(g).us; }},
  pa:{l:"Puntos en contra", u:"puntos", hb:-1, get:function(g){ return score(g).op; }},
  dif:{l:"Diferencia", u:"puntos", hb:1, zero:1, get:function(g){ var s=score(g); return s.us-s.op; }},
  efg:{l:"eFG%", u:"puntos de %", hb:1, suf:"%", get:function(g){ return efg(calc(g.events)); }},
  reb:{l:"Rebotes", u:"rebotes", hb:1, get:function(g){ return calc(g.events).reb; }},
  as:{l:"Asistencias", u:"asistencias", hb:1, get:function(g){ return calc(g.events).as; }},
  pe:{l:"Pérdidas", u:"pérdidas", hb:-1, get:function(g){ return calc(g.events).pe; }},
  ortg:{l:"Puntos por 100 posesiones", u:"puntos", hb:1, get:function(g){ var s=calc(g.events), p=possOf(s); return p>0 ? 100*s.pts/p : null; }}
};
var PLAYER_M = {
  pts:{l:"Puntos", u:"puntos", hb:1, get:function(g,id){ return calc(g.events,id).pts; }},
  val:{l:"Valoración", u:"de valoración", hb:1, zero:1, get:function(g,id){ return calc(g.events,id).val; }},
  reb:{l:"Rebotes", u:"rebotes", hb:1, get:function(g,id){ return calc(g.events,id).reb; }},
  as:{l:"Asistencias", u:"asistencias", hb:1, get:function(g,id){ return calc(g.events,id).as; }},
  pe:{l:"Pérdidas", u:"pérdidas", hb:-1, get:function(g,id){ return calc(g.events,id).pe; }},
  efg:{l:"eFG%", u:"puntos de %", hb:1, suf:"%", get:function(g,id){ return efg(calc(g.events,id)); }},
  ts:{l:"TS%", u:"puntos de %", hb:1, suf:"%", get:function(g,id){ return tsp(calc(g.events,id)); }},
  pm:{l:"Más/menos", u:"puntos", hb:1, zero:1, get:function(g,id){ var t=track(g); return t.tracked ? (t.pm[id]||0) : null; }},
  min:{l:"Minutos", u:"minutos", hb:1, get:function(g,id){ return g.min && g.min[id]!=null ? g.min[id] : null; }}
};

function linreg(xs, ys){
  var n=xs.length, sx=0, sy=0, sxx=0, sxy=0;
  for(var i=0;i<n;i++){ sx+=xs[i]; sy+=ys[i]; sxx+=xs[i]*xs[i]; sxy+=xs[i]*ys[i]; }
  var d = n*sxx - sx*sx; var b = d ? (n*sxy - sx*sy)/d : 0;
  return {b:b, a:(sy - b*sx)/n};
}
function trendOf(pts, m){
  var xs=[], ys=[];
  pts.forEach(function(p,i){ if(p.y!=null){ xs.push(i); ys.push(p.y); } });
  if(ys.length<3) return {fit:null, html:'<span class="pill">Faltan datos</span> <span class="muted small">La tendencia se calcula a partir de 3 partidos.</span>'};
  var fit = linreg(xs, ys);
  var mean = ys.reduce(function(a,b){return a+b;},0)/ys.length;
  var change = fit.b*(xs[xs.length-1]-xs[0]);
  var thr = m.suf==="%" ? 3 : Math.max(1, Math.abs(mean)*0.08);
  if(Math.abs(change) < thr) return {fit:fit, html:'<span class="pill">Estable</span> <span class="muted small">Sin cambios claros a lo largo de los partidos.</span>'};
  var up = fit.b>0, good = up === (m.hb>0);
  return {fit:fit, html:'<span class="pill '+(good?"w":"l")+'">'+(up?"↗ Al alza":"↘ A la baja")+'</span> <span class="small">'+(up?"+":"−")+f1(Math.abs(fit.b))+' '+m.u+' por partido de media</span>'};
}
function niceStep(raw){ var e=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/e; return (f<=1?1:f<=2?2:f<=5?5:10)*e; }
function fmtV(v, m){ if(v==null) return "–"; if(m.zero) return fsign(v, v%1!==0); return (v%1!==0 ? f1(v) : String(v))+(m.suf||""); }
function chartSVG(pts, m, fit){
  var W=960, H=250, L=44, R=16, T=14, B=34, n=pts.length;
  var vals = pts.map(function(p){return p.y;}).filter(function(v){return v!=null;});
  if(!vals.length) return '<p class="muted small">No hay datos de este apartado en estos partidos.</p>';
  var lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals);
  if(lo>0) lo=0; if(hi<0) hi=0;
  var st = niceStep(((hi-lo)||1)/4); lo=Math.floor(lo/st)*st; hi=Math.ceil(hi/st)*st; if(hi===lo) hi=lo+st;
  function X(i){ return n===1 ? L+(W-L-R)/2 : L + i*(W-L-R)/(n-1); }
  function Y(v){ return T + (hi-v)/(hi-lo)*(H-T-B); }
  var g = '';
  for(var v=lo; v<=hi+1e-9; v+=st){
    g += '<line class="ch-grid'+(Math.abs(v)<1e-9 && lo<0 ? ' ch-zero':'')+'" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/>'+
         '<text class="ch-lab" x="'+(L-8)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end">'+(Math.round(v*10)/10)+(m.suf||"")+'</text>';
  }
  var every = Math.ceil(n/8);
  pts.forEach(function(p,i){ if(i%every===0 || i===n-1) g += '<text class="ch-lab" x="'+X(i).toFixed(1)+'" y="'+(H-12)+'" text-anchor="middle">'+esc(p.x)+'</text>'; });
  if(fit){
    var xs=[]; pts.forEach(function(p,i){ if(p.y!=null) xs.push(i); });
    var x0=xs[0], x1=xs[xs.length-1];
    g += '<line class="ch-trend" x1="'+X(x0).toFixed(1)+'" y1="'+Y(fit.a+fit.b*x0).toFixed(1)+'" x2="'+X(x1).toFixed(1)+'" y2="'+Y(fit.a+fit.b*x1).toFixed(1)+'"/>';
  }
  var d='', pen=false;
  pts.forEach(function(p,i){ if(p.y==null){ pen=false; return; } d += (pen?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)+' '; pen=true; });
  g += '<path class="ch-line" d="'+d+'"/>';
  pts.forEach(function(p,i){
    if(p.y==null) return;
    var cx=X(i), cy=Y(p.y);
    g += '<circle class="ch-dot" cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="4.5"/>'+
         '<circle class="ch-hit" cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="16" data-tip="'+esc(p.tip+': '+fmtV(p.y,m))+'" data-px="'+(cx/W*100).toFixed(2)+'" data-py="'+(cy/H*100).toFixed(2)+'"/>';
  });
  return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(m.l)+' por partido">'+g+'</svg><div class="ch-tip" hidden></div></div>';
}
function shortDate(s){ try{ return new Date(s+"T12:00:00").toLocaleDateString("es-ES",{day:"numeric",month:"short"}).replace(".",""); }catch(e){ return s; } }
function metricChips(M, cur, key){
  return '<div class="chips" role="group" aria-label="Dato a analizar">'+Object.keys(M).map(function(k){
    return '<button data-do="'+key+':'+k+'" aria-pressed="'+(cur===k)+'">'+M[k].l+'</button>'; }).join("")+'</div>';
}
function lastVsAvg(pts, m){
  var ys = pts.map(function(p){return p.y;}).filter(function(v){return v!=null;});
  if(ys.length<4) return "";
  var avg = ys.reduce(function(a,b){return a+b;},0)/ys.length;
  var l3 = ys.slice(-3), a3 = l3.reduce(function(a,b){return a+b;},0)/3;
  return '<p class="muted small" style="margin:6px 0 0">Últimos 3 partidos: <b class="ink">'+fmtV(Math.round(a3*10)/10,m)+'</b> · Media de la temporada: <b class="ink">'+fmtV(Math.round(avg*10)/10,m)+'</b></p>';
}

/* ---------- Pestaña Estadísticas ---------- */
function viewStats(){
  var h = banner();
  if(U.player){ var pp = player(U.player); if(pp) return h + viewPlayerDetail(pp); U.player=null; }
  var team = U.stats!=="jugadores";
  h += '<div class="subbar"><div class="seg" role="group" aria-label="Estadísticas de"><button data-do="stats:equipo" aria-pressed="'+team+'">Equipo</button><button data-do="stats:jugadores" aria-pressed="'+(!team)+'">Jugadores</button></div>'+
    (team ? '' : '<div class="seg" role="group" aria-label="Tipo de cifras"><button data-do="season:avg" aria-pressed="'+(U.season==="avg")+'">Promedios</button><button data-do="season:tot" aria-pressed="'+(U.season!=="avg")+'">Totales</button></div>')+'</div>';
  var done = doneGames();
  if(!done.length) return h + '<section class="card"><h2>Estadísticas</h2><p class="muted">Aquí verás las estadísticas cuando termines el primer partido.</p></section>';
  return h + (team ? viewStatsTeam(done) : viewStatsPlayers(done));
}

function viewStatsTeam(done){
  var n = done.length, pf=0, pa=0, w=0, l=0;
  done.forEach(function(g){ var s=score(g); pf+=s.us; pa+=s.op; if(s.us>s.op) w++; else if(s.us<s.op) l++; });
  var s = calc(allEvents(done)), poss = possOf(s);
  var m = TEAM_M[U.mT] ? U.mT : "pf", M = TEAM_M[m];
  var pts = done.map(function(g){ return {x:shortDate(g.date), tip:shortDate(g.date)+' vs '+g.rival, y:M.get(g)}; });
  var tr = trendOf(pts, M);
  var h = '<section class="card"><div class="tiles">'+
    '<div class="tile"><b>'+n+'</b><span>Partidos jugados</span></div>'+
    '<div class="tile"><b>'+w+'–'+l+'</b><span>Victorias – derrotas</span></div>'+
    '<div class="tile"><b>'+f1(pf/n)+'</b><span>Puntos a favor por partido</span></div>'+
    '<div class="tile"><b>'+f1(pa/n)+'</b><span>Puntos en contra por partido</span></div>'+
    '<div class="tile"><b>'+fsign((pf-pa)/n,true)+'</b><span>Diferencia media</span></div></div></section>';
  h += '<section class="card"><div class="cardhead"><h2>Evolución · '+M.l+'</h2></div>'+metricChips(TEAM_M, m, "mT")+
    '<div class="trend">'+tr.html+'</div>'+chartSVG(pts, M, tr.fit)+
    '<p class="muted small" style="margin:4px 0 0">Cada punto es un partido. La línea discontinua es la tendencia.</p>'+lastVsAvg(pts, M)+'</section>';
  function kv(label, val, note){ return '<div class="kv"><span>'+label+(note?'<small>'+note+'</small>':'')+'</span><b>'+val+'</b></div>'; }
  h += '<div class="grid2"><section class="card"><h2>Promedios por partido</h2>'+
    kv("Puntos", f1(s.pts/n))+
    kv("Rebotes", f1(s.reb/n), f1(s.ro/n)+" ofensivos · "+f1(s.rd/n)+" defensivos")+
    kv("Asistencias", f1(s.as/n))+kv("Robos", f1(s.rb/n))+kv("Tapones", f1(s.tp/n))+
    kv("Pérdidas", f1(s.pe/n))+kv("Faltas", f1(s.fc/n))+
    kv("Tiros de 2", pct(s.t2m,s.t2a), f1(s.t2m/n)+" de "+f1(s.t2a/n))+
    kv("Triples", pct(s.t3m,s.t3a), f1(s.t3m/n)+" de "+f1(s.t3a/n))+
    kv("Tiros libres", pct(s.tlm,s.tla), f1(s.tlm/n)+" de "+f1(s.tla/n))+'</section>'+
    '<section class="card"><h2>Métricas avanzadas</h2>'+
    kv("eFG%", fpc(efg(s)), "Acierto en tiros de campo; el triple cuenta 1,5 veces")+
    kv("TS%", fpc(tsp(s)), "Acierto real, incluyendo los tiros libres")+
    kv("Posesiones por partido", f1(poss/n), "Estimadas con tiros, tiros libres, rebotes ofensivos y pérdidas")+
    kv("Puntos por 100 posesiones", poss>0?f1(100*s.pts/poss):"–", "Eficiencia en ataque")+
    kv("Recibidos por 100 posesiones", poss>0?f1(100*pa/poss):"–", "Eficiencia en defensa (se asume que el rival tiene las mismas posesiones)")+
    kv("Canastas asistidas", s.fgm?fpc(100*s.as/s.fgm):"–", "Porcentaje de canastas que vienen de una asistencia")+
    kv("Pérdidas por 100 posesiones", poss>0?f1(100*s.pe/poss):"–", "Cuidado del balón")+
    kv("Segundas oportunidades", (s.fga-s.fgm)?fpc(100*s.ro/(s.fga-s.fgm)):"–", "Rebotes ofensivos por cada 100 tiros de campo fallados")+
    kv("Tiros libres por tiro de campo", s.fga?f1(s.tla/s.fga).replace(/^0/,"0"):"–", "Capacidad para provocar faltas")+
    kv("Tiros de 3 sobre el total", s.fga?fpc(100*s.t3a/s.fga):"–", "Peso del triple en el juego")+'</section></div>';
  h += '<section class="card"><h2>Partido a partido</h2><div class="tbl-wrap"><table><thead><tr><th scope="col">Partido</th><th>Resultado</th><th>Dif.</th><th>%T2</th><th>%T3</th><th>%TL</th><th>eFG%</th><th>REB</th><th>AS</th><th>PE</th><th title="Puntos por 100 posesiones">Pts/100</th></tr></thead><tbody>'+

function seasonRows(done){
  return S.players.map(function(p){
    var gp = done.filter(function(g){ return g.roster.indexOf(p.id)>=0; });
    if(!gp.length) return null;
    var pm=0, pmn=0, mn=0, mnn=0;
    gp.forEach(function(g){ var t=track(g); if(t.tracked){ pm += (t.pm[p.id]||0); pmn++; } if(g.min && g.min[p.id]!=null){ mn += g.min[p.id]; mnn++; } });
    return {p:p, n:gp.length, s:calc(allEvents(gp), p.id), pm:pm, pmn:pmn, mn:mn, mnn:mnn, games:gp};
  }).filter(Boolean);
}

/* ---------- PDF (generado sin librerías, funciona sin conexión) ---------- */
function PDFDoc(){ this.W=842; this.H=595; this.pages=[]; this.c=null; }
PDFDoc.prototype.page = function(){ this.c=[]; this.pages.push(this.c); };
PDFDoc.prototype.col = function(hex){ var n=parseInt(hex.slice(1),16); return [((n>>16)&255)/255,((n>>8)&255)/255,(n&255)/255].map(function(v){ return v.toFixed(3); }).join(" "); };
PDFDoc.prototype.enc = function(s){ return String(s).replace(/[–—−]/g,"-").replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/…/g,"...").replace(/[↗↘]/g,"").replace(/[^\x00-\xFF]/g,"?").replace(/([\\()])/g,"\\$1"); };
PDFDoc.prototype.tw = function(s, size, bold){
  var w=0, ch;
  for(var i=0;i<s.length;i++){ ch=s.charAt(i);
    if(/[0-9]/.test(ch)) w+=556; else if(ch===" "||ch==="/"||ch==="."||ch===","||ch===":") w+=278; else if(ch==="%") w+=889; else if(ch==="-"||ch==="("||ch===")") w+=333; else if(ch==="+") w+=584;
    else if(/[A-ZÁÉÍÓÚÑ]/.test(ch)) w+= bold?722:667; else if(/[a-záéíóúñü]/.test(ch)) w+= bold?600:530; else w+=556; }
  return w*size/1000;
};
PDFDoc.prototype.text = function(x, y, s, o){
  o=o||{}; var size=o.size||9, str=String(s), w=this.tw(str,size,o.bold);
  if(o.align==="right") x-=w; else if(o.align==="center") x-=w/2;
  this.c.push("BT /"+(o.bold?"F2":"F1")+" "+size+" Tf "+this.col(o.color||"#1A1C21")+" rg "+x.toFixed(2)+" "+(this.H-y).toFixed(2)+" Td ("+this.enc(str)+") Tj ET");
};
PDFDoc.prototype.rect = function(x, y, w, h, color){ this.c.push(this.col(color)+" rg "+x.toFixed(2)+" "+(this.H-y-h).toFixed(2)+" "+w.toFixed(2)+" "+h.toFixed(2)+" re f"); };
PDFDoc.prototype.line = function(x1, y1, x2, y2, color, lw){ this.c.push(this.col(color||"#DDD9D0")+" RG "+(lw||0.6)+" w "+x1.toFixed(2)+" "+(this.H-y1).toFixed(2)+" m "+x2.toFixed(2)+" "+(this.H-y2).toFixed(2)+" l S"); };
PDFDoc.prototype.build = function(){
  var out="%PDF-1.4\n%âãÏÓ\n", offs=[], self=this;
  function obj(n, body){ offs[n]=out.length; out += n+" 0 obj\n"+body+"\nendobj\n"; }
  var np=this.pages.length, kids=[];
  for(var i=0;i<np;i++) kids.push((5+i*2)+" 0 R");
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
  obj(2,"<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+np+" >>");
  obj(3,"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
  obj(4,"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
  this.pages.forEach(function(c,i){
    var s=c.join("\n");
    obj(5+i*2,"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+self.W+" "+self.H+"] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents "+(6+i*2)+" 0 R >>");
    obj(6+i*2,"<< /Length "+s.length+" >>\nstream\n"+s+"\nendstream");
  });
  var total=5+np*2, xref=out.length;
  out += "xref\n0 "+total+"\n0000000000 65535 f \n";
  for(var k=1;k<total;k++) out += String(offs[k]).padStart(10,"0")+" 00000 n \n";
  out += "trailer\n<< /Size "+total+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF";
  var bytes=new Uint8Array(out.length); for(var j=0;j<out.length;j++) bytes[j]=out.charCodeAt(j)&255;
  return bytes;
};

/* ---------- Editar acta (minutos y cualquier estadística) ---------- */
var EF = ["t2m","t2a","t3m","t3a","tlm","tla","ro","rd","as","rb","tp","pe","fc"];
var EF_LBL = {min:"MIN",t2m:"T2 anot.",t2a:"T2 int.",t3m:"T3 anot.",t3a:"T3 int.",tlm:"TL anot.",tla:"TL int.",ro:"Reb. of.",rd:"Reb. def.",as:"Asist.",rb:"Robos",tp:"Tapones",pe:"Pérd.",fc:"Faltas"};
function maxQ(g){ var m=Math.max(4, g.q||1); g.events.forEach(function(e){ if(e.q>m) m=e.q; }); return m; }
function draftRow(g, id){
  var s = calc(g.events, id), r = {min:(g.min && g.min[id]!=null) ? g.min[id] : ""};
  EF.forEach(function(f){ r[f] = s[f]; });
  return r;
}
function makeDraft(g){
  var d = {id:g.id, rival:g.rival, date:g.date, place:g.place||"Local", roster:g.roster.slice(), opp:{}, p:{}, nq:maxQ(g)};
  for(var q=1;q<=d.nq;q++) d.opp[q] = score(g,q).op;
  g.roster.forEach(function(id){ d.p[id] = draftRow(g, id); });
  return d;
}
function num(v){ var n = parseInt(v,10); return isNaN(n) ? 0 : n; }
function rowPts(r){ return 2*num(r.t2m) + 3*num(r.t3m) + num(r.tlm); }
function draftTotals(d){
  var us=0, op=0;
  d.roster.forEach(function(id){ us += rowPts(d.p[id]); });
  for(var q=1;q<=d.nq;q++) op += num(d.opp[q]);
  return {us:us, op:op};

function saveEdit(){
  var d = U.draft, g = gameById(d.id), err = document.getElementById("ed-err");
  if(!g) return;
  function fail(msg){ err.textContent = msg; err.scrollIntoView({block:"center"}); }
  for(var i=0;i<d.roster.length;i++){
    var id=d.roster[i], p=player(id), r=d.p[id], who = p ? "#"+p.num+" "+p.name : "un jugador";
    for(var j=0;j<EF.length;j++){ var v=String(r[EF[j]]).trim(); if(v!=="" && (!/^\d+$/.test(v))) return fail("Revisa "+EF_LBL[EF[j]]+" de "+who+": tiene que ser un número entero, 0 o más."); }
    if(num(r.t2m)>num(r.t2a)) return fail("En "+who+", los tiros de 2 anotados no pueden ser más que los intentados.");
    if(num(r.t3m)>num(r.t3a)) return fail("En "+who+", los triples anotados no pueden ser más que los intentados.");
    if(num(r.tlm)>num(r.tla)) return fail("En "+who+", los tiros libres anotados no pueden ser más que los intentados.");
    var m = String(r.min).trim();
    if(m!=="" && (!/^\d+$/.test(m) || num(m)>70)) return fail("Revisa los minutos de "+who+": un número entre 0 y 70, o en blanco.");
  }
  for(var q=1;q<=d.nq;q++){ var o=String(d.opp[q]).trim(); if(o!=="" && !/^\d+$/.test(o)) return fail("Revisa los puntos del rival en el "+QL[q-1]+"."); }
  g.rival = String(d.rival).trim() || g.rival; g.date = d.date || g.date; g.place = d.place;
  g.roster = d.roster.slice();
  g.events = g.events.filter(function(e){ return e.a!=="ADJ" && e.a!=="OPPADJ"; });
  g.min = {};
  d.roster.forEach(function(id){
    var base = calc(g.events, id), r = d.p[id], dd = {}, any = false;
    EF.forEach(function(f){ var diff = num(r[f]) - base[f]; if(diff){ dd[f]=diff; any=true; } });
    if(any) g.events.push({id:uid(), p:id, a:"ADJ", d:dd, q:0, t:Date.now()});
    if(String(r.min).trim()!=="") g.min[id] = num(r.min);
  });
  for(var qq=1;qq<=d.nq;qq++){
    var diff = num(d.opp[qq]) - score(g,qq).op;
    if(diff) g.events.push({id:uid(), p:null, a:"OPPADJ", pts:diff, q:qq, t:Date.now()});
  }
  U.draft=null; U.justFinished=null; save(); render(); window.scrollTo(0,0);
  toast("Cambios guardados", null);
}

function exportFile(name, data, mime){
  var isText = typeof data==="string";
  function fallback(){
    try{ var a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type:mime})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){ a.remove(); },100); }catch(e){}
    if(isText) U.modal = {title:"Guardar datos", html:'<p class="muted small">Si el archivo no se ha descargado, copia este texto y guárdalo en una nota o en un archivo llamado '+esc(name)+'.</p><textarea id="cp" readonly rows="8">'+esc(data)+'</textarea>', ok:"Cerrar", copy:true};
    else U.modal = {title:"Descarga", body:"Si el archivo "+name+" no se ha descargado, abre la app directamente en el navegador (fuera del chat) y vuelve a intentarlo.", ok:"Entendido"};
    render();
  }
  if(downloads){
    downloads.save({filename:name, data: isText ? data : new Blob([data],{type:mime})}).catch(function(err){
      if(err && err.code==="declined") return;
      if(err && err.code==="rate_limited"){ U.modal={title:"Espera un momento", body:"Ya hay una descarga pendiente de confirmar.", ok:"Entendido"}; render(); return; }
      fallback();
    });
  } else fallback();
}

function csvOf(g){
  var mins = g.min||{};
  var rows = [["Dorsal","Jugador","MIN","PTS","T2A","T2I","T3A","T3I","TLA","TLI","RO","RD","REB","AS","RB","TP","PE","FC","VAL"]];
  g.roster.map(player).filter(Boolean).sort(byNum).forEach(function(p){ var s=calc(g.events,p.id);
    rows.push([p.num,p.name,mins[p.id]!=null?mins[p.id]:"",s.pts,s.t2m,s.t2a,s.t3m,s.t3a,s.tlm,s.tla,s.ro,s.rd,s.reb,s.as,s.rb,s.tp,s.pe,s.fc,s.val]); });
  return "﻿"+rows.map(function(r){ return r.map(function(v){ v=String(v); return /[;"\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }).join(";"); }).join("\n");
}

function go(tab){ U.draft=null; U.justFinished=null; U.player=null; U.bench=null; U.toast=null; paintToast(); U.tab=tab; U.game=null; U.edit=null; if(location.hash!=="#"+tab){ try{ location.hash=tab; }catch(e){} } render(); window.scrollTo(0,0); }
window.addEventListener("hashchange", function(){ var h=location.hash.slice(1); if(h==="temporada") h="estadisticas"; if(TABS.indexOf(h)>=0 && h!==U.tab){ U.tab=h; U.game=null; render(); } });

document.addEventListener("click", function(e){
  var b = e.target.closest("[data-do]"); if(!b) return;
  var raw = b.getAttribute("data-do"), i = raw.indexOf(":");
  var k = i<0 ? raw : raw.slice(0,i), v = i<0 ? "" : raw.slice(i+1);
  var g = liveGame();
  switch(k){
    case "tab": go(v); break;
    case "sel": U.sel = U.sel===v ? null : v; render(); break;
    case "court":
      if(!g) return;
      if(U.bench){
        var oc1 = ensureCourt(g), k1 = oc1.indexOf(v); if(k1<0) return;
        var inId = U.bench; oc1[k1] = inId; var se = addSub(g, inId, v); U.bench=null; U.sel=null; save(); render(); buzz();
        toast("Cambio: entra "+tag(inId)+", sale "+tag(v), se.id);
      } else { U.sel = U.sel===v ? null : v; render(); }
      break;
    case "bench":
      if(!g) return;
      var oc2 = ensureCourt(g), free = oc2.indexOf(null); U.sel=null;
      if(free>=0){ oc2[free]=v; var se2 = addSub(g, v, null); U.bench=null; save(); render(); buzz(); toast("Entra a pista "+tag(v), se2.id); }
      else { U.bench = U.bench===v ? null : v; render(); }
      break;
    case "cancel-sub": U.bench=null; render(); break;
    case "tobench":
      if(!g) return;
      var oc3 = ensureCourt(g), k3 = oc3.indexOf(v); if(k3<0) return;
      oc3[k3]=null; var se3 = addSub(g, null, v); U.sel=null; save(); render(); toast("Al banquillo "+tag(v), se3.id); break;
    case "act":
      if(!g || !U.sel) return;
      var ev = {id:uid(), p:U.sel, a:v, q:g.q, t:Date.now()}; g.events.push(ev);
      var p = player(U.sel); U.sel = null; save(); render(); buzz();
      toast("#"+p.num+" "+short(p.name)+" · "+ACT[v].t, ev.id); break;
    case "opp":
      if(!g) return;
      var oe = {id:uid(), p:null, a:"OPP", pts:+v, q:g.q, t:Date.now()}; g.events.push(oe); save(); render(); buzz();
      toast(g.rival+" +"+v, oe.id); break;
    case "q": if(g){ g.q=+v; save(); render(); } break;
    case "undo": if(g){ var lv = g.events.filter(function(e){ return e.a!=="ADJ" && e.a!=="OPPADJ"; }); if(lv.length){ removeEv(g, lv[lv.length-1].id); save(); render(); } } break;
    case "undo-ev": case "delev":
      if(g){ removeEv(g, v); save(); render(); }
      if(k==="undo-ev"){ U.toast=null; paintToast(); } break;
    case "sub": U.sub=v; render(); break;
    case "finish":
      var fs = score(g);
      U.modal = {title:"¿Seguro que quieres finalizar el partido?", body:"Marcador: "+S.team+" "+fs.us+" – "+fs.op+" "+g.rival+" ("+QL[g.q-1]+"). Si has pulsado por error, sigue anotando. Al finalizar ya no podrás anotar jugada a jugada, pero sí apuntar los minutos y corregir las estadísticas.", ok:"Sí, finalizar", cancel:"No, seguir anotando", fn:function(){
        g.done=true; S.liveId=null; U.tab="historial"; U.game=g.id; U.sel=null; U.draft=makeDraft(g); U.justFinished=g.id; try{ location.hash="historial"; }catch(e){}
      }}; render(); break;
    case "edit": U.edit=v; render(); window.scrollTo(0,0); var n=document.getElementById("p-name"); if(n) n.focus(); break;
    case "cancel-edit": U.edit=null; render(); break;
    case "delp":
      var pl = player(v); if(!pl) return;
      var used = S.games.some(function(gm){ return gm.events.some(function(x){ return x.p===v; }); });
      if(used) confirmBox("Dar de baja a "+pl.name, "Tiene estadísticas guardadas, así que se conservarán en el historial. Dejará de aparecer en los nuevos partidos.", "Dar de baja", true, function(){ pl.active=false; if(U.edit===v) U.edit=null; });
      else confirmBox("Quitar a "+pl.name, "Se eliminará de la plantilla.", "Quitar", true, function(){
        S.players = S.players.filter(function(x){ return x.id!==v; });
        S.games.forEach(function(gm){ gm.roster = gm.roster.filter(function(x){ return x!==v; }); if(gm.onCourt) gm.onCourt = gm.onCourt.map(function(x){ return x===v ? null : x; }); });
        if(U.edit===v) U.edit=null;
      });
      break;
    case "restore": var rp=player(v); if(rp){ rp.active=true; save(); render(); } break;
    case "open": U.game=v; render(); window.scrollTo(0,0); break;
    case "close": U.game=null; render(); break;
    case "delg":
      confirmBox("Borrar partido", "Se borrará el partido y todas sus estadísticas. No se puede deshacer.", "Borrar", true, function(){
        S.games = S.games.filter(function(x){ return x.id!==v; }); if(S.liveId===v) S.liveId=null; U.game=null;
      }); break;
    case "csv": var cg=gameById(v); if(cg) exportFile("partido-"+cg.date+"-"+cg.rival.replace(/[^\wáéíóúñ-]+/gi,"-")+".csv", csvOf(cg), "text/csv"); break;
    case "export": exportFile("baloncesto-copia-"+today()+".json", JSON.stringify(S), "application/json"); break;
    case "import": var fi=document.getElementById("imp"); if(fi) fi.click(); break;
    case "clear-sample":
      confirmBox("Borrar datos de ejemplo", "Se quitarán los jugadores y partidos de ejemplo. Lo que hayas añadido tú se mantiene.", "Borrar ejemplo", true, function(){
        S.players = S.players.filter(function(x){ return !x.sample; });
        S.games = S.games.filter(function(x){ return !x.sample; });
        if(!liveGame()) S.liveId=null;
        S.sample=false; U.sel=null; U.game=null; U.tab="jugadores"; try{ location.hash="jugadores"; }catch(e){}
      }); break;
    case "season": U.season=v; render(); break;
    case "edit-game": var eg=gameById(v); if(eg){ U.draft=makeDraft(eg); U.justFinished=null; render(); window.scrollTo(0,0); } break;
    case "edit-cancel": U.draft=null; U.justFinished=null; render(); window.scrollTo(0,0); break;
    case "edit-addq": if(U.draft && U.draft.nq<5){ U.draft.nq++; U.draft.opp[U.draft.nq]=0; render(); } break;
    case "edit-addp":
      var sel2=document.getElementById("ed-add"); if(!U.draft || !sel2) return;
      var nid=sel2.value; if(U.draft.roster.indexOf(nid)<0){ U.draft.roster.push(nid); var eg2=gameById(U.draft.id); U.draft.p[nid]=draftRow(eg2,nid); }
      render(); break;
    case "stats": U.stats=v; U.player=null; render(); break;
    case "player": U.player=v; render(); window.scrollTo(0,0); break;
    case "player-close": U.player=null; render(); break;
    case "mT": U.mT=v; render(); break;
    case "mP": U.mP=v; render(); break;
    case "open-h": U.tab="historial"; U.game=v; U.player=null; try{ location.hash="historial"; }catch(e){} render(); window.scrollTo(0,0); break;
    case "pdf":
      var pg = gameById(v); if(!pg) return;
      try{ exportFile("partido-"+pg.date+"-"+pg.rival.replace(/[^\wáéíóúñ-]+/gi,"-")+".pdf", pdfGame(pg), "application/pdf"); }
      catch(err){ U.modal={title:"No se pudo crear el PDF", body:"Ha ocurrido un error al generar el archivo. Prueba otra vez.", ok:"Entendido"}; render(); }
      break;

    case "modal-ok": var fn = U.modal && U.modal.fn; U.modal=null; if(fn) fn(); save(); render(); break;
    case "modal-cancel": U.modal=null; render(); break;
    case "copy":
      var ta=document.getElementById("cp"); if(!ta) return;
      try{ navigator.clipboard.writeText(ta.value).then(function(){ b.textContent="Copiado"; }).catch(function(){ ta.select(); b.textContent="Selecciona y copia"; }); }
      catch(err){ ta.select(); }
      break;
  }
});

document.addEventListener("submit", function(e){
  e.preventDefault();
  var f = e.target;
  if(f.id==="f-edit"){ saveEdit(); return; }
  if(f.id==="f-game"){
    var roster = Array.prototype.map.call(f.querySelectorAll('input[type="checkbox"]:checked'), function(x){ return x.value; });
    if(!roster.length){ document.getElementById("g-err").textContent="Marca al menos un jugador convocado."; return; }
    var g = {id:uid(), rival:(document.getElementById("g-rival").value.trim()||"Rival"), date:(document.getElementById("g-date").value||today()),
      place:document.getElementById("g-place").value, roster:roster, events:[], q:1, done:false, onCourt:[null,null,null,null,null]};
    S.games.push(g); S.liveId=g.id; U.sub="anotar"; U.sel=null; save(); render(); window.scrollTo(0,0);
  }
  if(f.id==="f-player"){
    var err = document.getElementById("p-err");
    var numS = document.getElementById("p-num").value.trim(), name = document.getElementById("p-name").value.trim(), pos = document.getElementById("p-pos").value;
    var num = parseInt(numS,10);
    if(numS==="" || isNaN(num) || num<0 || num>99){ err.textContent="Escribe un dorsal entre 0 y 99."; document.getElementById("p-num").focus(); return; }
    if(!name){ err.textContent="Escribe el nombre del jugador."; document.getElementById("p-name").focus(); return; }
    var dup = S.players.filter(function(p){ return p.active && p.num===num && p.id!==U.edit; })[0];
    if(dup){ err.textContent="El dorsal "+num+" ya lo tiene "+dup.name+"."; document.getElementById("p-num").focus(); return; }
    if(U.edit){ var p=player(U.edit); if(p){ p.num=num; p.name=name; p.pos=pos; } U.edit=null; }
    else S.players.push({id:uid(), num:num, name:name, pos:pos, active:true});
    save(); render(); var pn=document.getElementById("p-num"); if(pn) pn.focus();
  }
  if(f.id==="f-team"){
    S.team = document.getElementById("t-name").value.trim() || "Mi equipo"; save(); render();
  }
});

document.addEventListener("input", function(e){ if(e.target.getAttribute && e.target.getAttribute("data-ed")) onEditInput(e.target); });
document.addEventListener("change", function(e){
  if(e.target.getAttribute && e.target.getAttribute("data-ed")){ onEditInput(e.target); return; }
  if(e.target.id!=="imp") return;
  var file = e.target.files && e.target.files[0]; if(!file) return;
  var rd = new FileReader();
  rd.onload = function(){
    try{
      var d = JSON.parse(rd.result);
      if(!d || !Array.isArray(d.players) || !Array.isArray(d.games)) throw new Error("formato");
      confirmBox("Importar copia", "La copia tiene "+d.players.length+" jugadores y "+d.games.length+" partidos. Sustituirá a todos los datos actuales.", "Importar", true, function(){
        S = {v:1, team:d.team||"Mi equipo", players:d.players, games:d.games, liveId:d.liveId||null, sample:!!d.sample};
        U.sel=null; U.game=null; U.edit=null;
      });
    }catch(err){
      U.modal = {title:"No se pudo importar", body:"El archivo no es una copia de esta app. Elige el archivo .json que exportaste desde aquí.", ok:"Entendido"}; render();
    }
  };
  rd.readAsText(file);
  e.target.value = "";
});

function showTip(el){
  var wrap = el.closest(".chart"); if(!wrap) return; var tip = wrap.querySelector(".ch-tip");
  tip.textContent = el.getAttribute("data-tip"); tip.style.left = el.getAttribute("data-px")+"%"; tip.style.top = el.getAttribute("data-py")+"%"; tip.hidden = false;
}
document.addEventListener("pointerover", function(e){ var h = e.target.closest && e.target.closest(".ch-hit"); if(h) showTip(h); });
document.addEventListener("pointerout", function(e){ var h = e.target.closest && e.target.closest(".ch-hit"); if(h){ var t=h.closest(".chart").querySelector(".ch-tip"); if(t) t.hidden=true; } });
document.addEventListener("click", function(e){ var h = e.target.closest && e.target.closest(".ch-hit"); if(h) showTip(h); });
document.addEventListener("keydown", function(e){ if(e.key==="Escape" && U.modal){ U.modal=null; render(); } });

render();
})();
</script>
</body>
</html>
